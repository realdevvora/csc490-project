[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-lens"
version = "0.1.0"
description = "Research scaffold for nuisance-aware visual regression detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "PyYAML>=6,<7",
]
evaluation = [
    "numpy>=1.26",
    "scipy>=1.11",
]

dino = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.56,<5",
    "Pillow>=10",
    "matplotlib>=3.9",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
