[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-lens"
version = "0.1.0"
description = "Research scaffold for nuisance-aware visual regression detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "PyYAML>=6,<7",
]
evaluation = [
    "numpy>=1.26",
    "scipy>=1.11",
]
diffspot = [
    "datasets>=3,<5",
    "huggingface_hub>=0.34,<1",
    "Pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "truststore>=0.10",
]
uiclip = [
    "torch>=2.7",
    "transformers>=4.44",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10",
]
figures = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10",
]

dino = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.56,<5",
    "Pillow>=10",
    "matplotlib>=3.9",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"regression_lens.data" = ["diffspot_taxonomy_v1.json"]
"regression_lens.evaluation._diffspot_official" = ["LICENSE", "PROVENANCE.json", "prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
