[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-lens"
version = "0.1.0"
description = "Research scaffold for nuisance-aware visual regression detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "PyYAML>=6,<7",
]
uiclip = [
    "torch>=2.7",
    "transformers>=4.44",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10",
]
figures = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
